<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="firstpart">
        <div class="contactdiv">
          <div class="calldiv">
            <img src="Call.svg" alt="" />
            <span>+xx xxx xxx x</span>
          </div>

          <div class="emaildiv">
            <img src="Email.svg" alt="" />
            <span>xxxxxxxxxx@xxxxxx.com</span>
          </div>
        </div>
        <div class="socialdiv">
          <img src="instagram.svg" alt="" />
          <img src="facebook.svg" alt="" />
          <img src="Twitter.svg" alt="" />
          <img src="Linkedin.svg" alt="" />
        </div>
      </div>
      <div class="line"></div>

      <div class="secondpart">
        <h1 class="furniture">Furniture</h1>
        <div class="navdiv">
          <nav>Home</nav>
          <nav>About</nav>
          <nav class="furniturenav">
            Furniture <img src="chevron-down.svg" />
          </nav>
          <nav>Car Catalogue</nav>
          <nav>FAQ</nav>
        </div>
        <div class="authdiv">
          <button class="signinbutton">sign in</button>
          <button class="signupbutton">sign up</button>
        </div>
      </div>
    </header>
    <section class="sectionone">
      <div class="leftdiv">
        <h1 class="perfectheader">Perfect Harmony: Comfort & Style</h1>

        <p class="perfectp">
          Explore furniture that harmoniously combines comfort and style to
          elevate your home
        </p>
        <div class="buttondiv">
          <button class="leftbutton">Explore Our Offers</button>
          <button class="rightbutton">
            <img src="Play.svg" alt="" /> watch video
          </button>
          <div class="whitediv">
            <div class="cozydiv">       
<span>Confort</span>
<br>
<div class="cozydiv1">
<img src="Location.svg" class="locationclass">
<span>Cozy Seating</span>
</div>
            </div>
            
          
          </div>
        </div>
      </div>
      <img class="ornament" src="Rectangle 1.png" alt="ornament img" />
    </section>

</html>
